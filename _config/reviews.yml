---
Name: silvershop-reviews
After:
  - '#silvershop'
---
SilverShop\Page\Product:
  extensions:
    - SilverShop\Reviews\Extension\ReviewableProductExtension

SilverShop\Page\ProductController:
  extensions:
    - SilverShop\Reviews\Extension\ProductReviewControllerExtension

SilverStripe\SiteConfig\SiteConfig:
  extensions:
    - SilverShop\Reviews\Extension\ShopReviewExtension

SilverShop\Reviews\Model\Review:
  # Master switch for the whole reviews feature (list + form + votes). Set false to hide reviews entirely.
  allow_reviews: true
  # Reviews are hidden until an admin approves them. Set false to publish immediately.
  moderation: true
  # Who may submit a review: 'anyone' | 'members' | 'verified' (verified = must have purchased the product).
  who_can_review: 'anyone'
  # Minimum seconds between review submissions from one session (basic anti-spam throttle).
  submit_throttle_seconds: 30
  # Helpful votes + photo uploads on reviews (v5).
  allow_votes: true
  allow_photos: true
  max_photos: 3
  # Reviews shown per page on the product page (0 = show all, no pagination).
  reviews_per_page: 10

SilverShop\Reviews\Model\ProductQuestion:
  # Master switch for the whole Q&A feature (list + ask form). Set false to hide Q&A entirely.
  allow_qna: true
  # Questions are hidden until approved; who_can_ask: 'anyone' | 'members'.
  moderation: true
  who_can_ask: 'anyone'

# External review providers (v4). Adapters are registered here; pick the active one on your site and set its
# credentials. 'active' empty = native reviews only. Each adapter is inert until its API keys are configured.
SilverShop\Reviews\Provider\ReviewProviderRegistry:
  active: ''
  providers:
    trustpilot: '%$SilverShop\Reviews\Provider\TrustpilotProvider'
    kiyoh: '%$SilverShop\Reviews\Provider\KiyohProvider'
    feedbackcompany: '%$SilverShop\Reviews\Provider\FeedbackCompanyProvider'
    demo: '%$SilverShop\Reviews\Provider\DemoReviewProvider'

SilverStripe\Core\Injector\Injector:
  Psr\SimpleCache\CacheInterface.reviewsProvider:
    factory: SilverStripe\Core\Cache\CacheFactory
    constructor:
      namespace: reviewsProvider
